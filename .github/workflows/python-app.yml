name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "技术部资料一键归档" "技术部资料一键归档.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 技术部资料归档程序
          path: dist/*.exe
          if-no-files-found: error
